[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bar_impact"
version = "0.1.0"
description = "Baryon Impact Analysis for Cosmological Maps"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Andreas Tersenov", email = "andreas.tersenov@example.com"},
]
keywords = [
    "cosmology",
    "weak lensing",
    "baryons",
    "neural posterior estimation",
    "wavelet analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20",
    "healpy>=1.15",
    "h5py>=3.0",
    "tqdm>=4.60",
    "matplotlib>=3.3",
    "scipy>=1.7",
]

[project.optional-dependencies]
inference = [
    "jax>=0.3",
    "jaxlib>=0.3",
    "jaxili>=0.1",  # For NPE
    "getdist>=1.3",  # For visualization
]
coverage = [
    "tarp>=0.1.3",  # For coverage testing
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
    "flake8>=4.0",
    "mypy>=0.950",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "types-setuptools",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
    "sphinx-autodoc-typehints>=1.22",
    "myst-parser>=1.0",
    "sphinx-autobuild>=2021.0",
]
all = [
    "bar_impact[inference,coverage,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/AndreasTersenov/bar_impact"
Documentation = "https://github.com/AndreasTersenov/bar_impact#readme"
Repository = "https://github.com/AndreasTersenov/bar_impact"
Issues = "https://github.com/AndreasTersenov/bar_impact/issues"

[project.scripts]
bar-impact = "bar_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bar_impact = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = false
strict_optional = false
# Common in numpy-heavy code
check_untyped_defs = false
# Allow method signature variation in subclasses
allow_subclassing_any = true

[[tool.mypy.overrides]]
module = ["jax.*", "jaxlib.*", "jaxili.*", "pymaster.*", "pycs.*", "healpy.*", "tarp.*", "getdist.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["bar_impact.utils.*", "bar_impact.inference.*"]
# These modules use conditional imports heavily
ignore_errors = true

[[tool.mypy.overrides]]
module = ["bar_impact.processing.*"]
# Processing subclasses have specialized signatures - this is intentional design
disable_error_code = ["override", "arg-type", "return-value"]

[[tool.mypy.overrides]]
module = ["bar_impact.core.*"]
# Core modules have numpy type annotation complexity
disable_error_code = ["assignment"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument (common in callbacks/interfaces)
    "ARG002", # unused method argument
    "SIM108", # use ternary operator
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["ARG001", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["bar_impact"]

[tool.coverage.run]
source = ["bar_impact"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 70
